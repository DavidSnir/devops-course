apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: demo-cluster
  region: eu-central-1

accessConfig:
  authenticationMode: API
  bootstrapClusterCreatorAdminPermissions: true

managedNodeGroups:
  - name: demo-ng
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 1