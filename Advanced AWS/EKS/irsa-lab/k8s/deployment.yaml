apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      serviceAccountName: app
      initContainers:
        - name: download
          image: amazon/aws-cli
          command:
            - aws
            - s3
            - cp
            - s3://s3-eks-role-lab/README.md
            - /dev/stdout
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
