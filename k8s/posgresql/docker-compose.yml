version: "3.9"

networks:
  backend-net:
  frontend-net:

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:17
    container_name: shopflow-postgres
    networks: [backend-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: company
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d company"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
      
  backend:
    build:
      context: ./backend
      target: production
    container_name: shopflow-backend
    networks: [backend-net]
    # ports:
    #   - 3000:3000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      target: production
    container_name: shopflow-frontend
    networks: [backend-net, frontend-net]
    ports:
      - 80:80
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
