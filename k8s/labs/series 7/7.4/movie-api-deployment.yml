apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-api-deployment
  namespace: dev
  labels:
    app: movie-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: movie-api
  template:
    metadata:
      labels:
        app: movie-api
    spec:
      containers:
      - name: movie-api
        image: davidsnir/movie-api:v2.0
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
