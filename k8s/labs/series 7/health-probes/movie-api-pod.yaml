apiVersion: v1
kind: Pod
metadata:
  name: movie-api-pod
spec:
  containers:
    - name: movie-api
      image: davidsnir/movie-api:v3.1
      ports:
        - containerPort: 3000
      env:
        - name: FAIL_LIVENESS
          value: "true"
      resources:
        limits:
          cpu: "500m"
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /health
          port: 3000
        failureThreshold: 2
        periodSeconds: 3