apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-api-deployment
  namespace: movies
  annotations:
    versions: "v2"
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: movie-api
  template:
    metadata:
      labels:
        app: movie-api
    spec:
      containers:
      - name: movie-api
        image: davidsnir/movie-api:v2
        ports:
        - containerPort: 3000
