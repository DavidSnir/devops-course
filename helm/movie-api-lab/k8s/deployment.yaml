apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-api
spec:
  selector:
    matchLabels:
      app: movie-api
  template:
    metadata:
      labels:
        app: movie-api
    spec:
      containers:
      - name: movie-api
        image: davidsnir/movie-api:1.1
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        env:
        - name: LOG-LEVEL
          value: "info"
        envFrom:
        - configMapRef:
            name: movie-api-config
        - secretRef:
            name: movie-api-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000

            
